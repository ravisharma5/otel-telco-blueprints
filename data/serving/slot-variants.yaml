sizing_table:
  - slot: "LLM 31B"
    precision: "bf16"
    weights: "about 62.6 GB"
    hardware_class: "Single large GPU with about 141 GB or more, or a Multi-GPU core node with two GPUs of about 80 GB in tensor parallel"
    variants: [llm-31b-bf16]
  - slot: "LLM 31B, operator-made build"
    precision: "FP8 W8A8"
    weights: "about 33 GB"
    hardware_class: "Single large GPU (about 80 GB or more); Small edge GPU at the 48 GB end, with less room for KV cache"
    variants: [llm-31b-fp8]
  - slot: "Decision 26B-A4B"
    precision: "W4A16"
    weights: "about 17 GB"
    hardware_class: "Small edge GPU (about 24 to 48 GB), tight at 24 GB; Single large GPU for high concurrency"
    variants: [decision-26b-a4b-w4a16]
  - slot: "Safety 12B"
    precision: "bf16"
    weights: "about 24 GB"
    hardware_class: "Small edge GPU at the 48 GB end, or Single large GPU"
    variants: [safety-12b-bf16]
  - slot: "Classification 8.3B"
    precision: "bf16 or FP8"
    weights: "about 17 GB in bf16, about 8.5 GB in FP8"
    hardware_class: "Small edge GPU (about 24 to 48 GB)"
    variants: [classification-8.3b-bf16, classification-8.3b-fp8]
  - slot: "Embedding and Reranker, 0.6B to 8B"
    precision: "bf16"
    weights: "about 1.2 to 16 GB"
    hardware_class: "Small edge GPU, or a slice of a Single large GPU"
    variants: [embedding-0.6b-bf16, embedding-8b-bf16, reranker-0.6b-bf16, reranker-4b-bf16]
  - slot: "Small Embedding models up to 335M"
    precision: "bf16 or fp32"
    weights: "under 1.5 GB"
    hardware_class: "CPU"
    variants: [embedding-small-cpu]
