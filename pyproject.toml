[project]
name = "otel-telco-blueprints-tools"
version = "0.1.0"
description = "Linter, schemas, and tests for the OTel Telco Production Blueprints"
requires-python = ">=3.11.5"
license = "Apache-2.0"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "markdown-it-py==4.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
site = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.1",
    "pymdown-extensions==13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["."]
addopts = "-ra"
