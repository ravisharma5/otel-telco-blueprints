[project]
name = "otel-telco-blueprints-tools"
version = "0.1.0"
description = "Linter, schemas, and tests for the OTel Telco Production Blueprints"
requires-python = ">=3.11.5"
license = "Apache-2.0"
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "markdown-it-py==4.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pypdf==6.21.4"]
site = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.1",
    "pymdown-extensions==13.0",
]
# Proposal PDF (tools/site/build_pdf.py). Needs system Pango: brew install pango
# locally, pinned apt packages in .github/workflows/pages.yml.
pdf = ["weasyprint==70.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["."]
addopts = "-ra -m \"not site_output\""
# An empty parametrization (ENTRY_PAGES before the first entry lands) skips.
empty_parameter_set_mark = "skip"
markers = [
    "site_output: reads built output (run make site or make explorer first)",
    "pdf: builds the proposal PDF (needs Pango; skips unless installed, fails when REQUIRE_PDF=1)",
]
