# Runs the same `make ci` as local development, so CI and local results match.
# Security: pull_request only (never pull_request_target), read-only token, no secrets.
# Optional hardening: pin actions by commit SHA.
name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: "3.26.0"
      # SHA-256 of vale_3.26.0_Linux_64-bit.tar.gz, computed locally and cross-checked
      # against the release checksums file. Hardcoding it here makes it a trust anchor
      # that a tampered release (tarball and checksums swapped together) cannot match.
      VALE_SHA256: "22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed"
      REQUIRE_VALE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          # Same uv version that produced uv.lock.
          version: "0.9.28"
      - name: Install Vale (pinned, verified against hardcoded SHA-256)
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}
          curl -sSLO "$base/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | sha256sum -c -
          tar xzf "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --locked fails instead of re-resolving when uv.lock is stale.
      - run: uv sync --all-extras --locked
      - run: make ci
