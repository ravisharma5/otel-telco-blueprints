# Vale 3.26.0 config. Core keys must sit above any [section] (E201 otherwise).
StylesPath = .vale/styles
MinAlertLevel = suggestion
# Google developer style v0.7.1 is vendored at .vale/styles/Google (see PROVENANCE.txt).
# There is no Packages line, so nothing is downloaded at run time.
# Project vocabulary: .vale/styles/config/vocabularies/Blueprints/accept.txt
Vocab = Blueprints
# Code spans are where authors quote banned words and bad OTel usages on purpose.
IgnoredScopes = code, tt

[*.md]
BasedOnStyles = Vale, Google, Blueprints
# OTel checkpoint names (OTel-2.0-LLM-31B-IT) trip Acronyms and Contractions; skip them as tokens.
# Only checkpoint names are ignored: "OTel-" plus a digit or a family word. Tracing
# terms such as OTel-Collector or OTel-SDK are deliberately not ignored, so the tracing rule still sees them.
TokenIgnores = (OTel-(?:\d|LLM|Embedding|Reranker|Decision|Safety|Classification)[\w.\-]*)
# Model sizes like 31B are not units
Google.Units = NO
