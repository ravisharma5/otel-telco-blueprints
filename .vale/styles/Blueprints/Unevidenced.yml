# Claims need a linked source, not an adjective.
# "Validated Patterns" is a Red Hat product name.
# Negations ("not validated", "not yet validated", "never validated") are skipped
# here so they are reported once, by Blueprints.ValidationStatus.
extends: existence
message: "Avoid '%s'. Link the source for the claim instead."
level: error
ignorecase: true
tokens:
  - proven
  - (?<!not )(?<!not yet )(?<!never )validated(?! Patterns)
  - production[- ]ready
  - seamless(?:ly)?
  - robust
  - cutting-edge
tests:
  - name: flags bare validated
    input: The model is validated.
    contains: "'validated'"
  - name: flags operator-validated
    input: This claim is operator-validated.
    contains: "'validated'"
  - name: allows the product name Validated Patterns
    input: Red Hat Validated Patterns use tiers.
    absent: Blueprints.Unevidenced
  - name: flags marketing adjectives
    input: A seamless, production-ready, robust design.
    contains: ["'seamless'", "'production-ready'", "'robust'"]
  - name: leaves not validated to ValidationStatus
    input: The Decision model is not validated on this engine.
    absent: Blueprints.Unevidenced
  - name: leaves not yet validated to ValidationStatus
    input: It is not yet validated.
    absent: Blueprints.Unevidenced
  - name: leaves never validated to ValidationStatus
    input: It was never validated.
    absent: Blueprints.Unevidenced
