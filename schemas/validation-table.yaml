# Canonical validation table, shared by both blueprint templates and the linter.
# Rules: three evidence columns; the headline E is the minimum over load-bearing
# rows; only the operator-task eval column can raise E, context columns never do;
# each level needs its evidence tier; a revision is required from E2.
# See framework/definitions.md.

columns:
  - "#"
  - "Claim"
  - "Slot / component"
  - "Load-bearing"
  - "Vendor-reported"
  - "GSMA external"
  - "Our operator-task eval"
  - "E-level"
  - "Evidence"
  - "Result"
  - "Date"
  - "Release / revision"

# Quoted on purpose: unquoted yes/no load as booleans under YAML 1.1.
# Matched case-insensitively after trimming whitespace. Any other value
# (for example "Yes (core)", "y", or a blank cell) is a VT007 error, and the row
# still counts toward the headline minimum (fail closed).
load_bearing_values: ["yes", "no"]

# Leading code is parsed for the minimum rule; "(evaluated)" requires an eval report link.
e_level_pattern: '^E[0-4]( \(evaluated\))?$'

empty_cell_values: ["", "—", "-"]

# Context only: these columns never raise the E-level.
context_columns:
  - "Vendor-reported"
  - "GSMA external"

# The only evidence column that can raise the E-level.
raising_column: "Our operator-task eval"

# Required evidence link type per E-level.
evidence_tiers:
  E0: http
  E1: repo-file
  E2: repo-file
  E3: repo-file
  E4: repo-file
  evaluated: repo-file

# Rows at or above this level must fill "Release / revision".
revision_required_from: E2

# Evidence location for repo-file tiers. The linked file must be a
# regular file under a directory with one of these names that sits in the
# blueprint's own folder or in any parent folder up to and including the
# repository root. It can never be the blueprint itself. Containment is judged
# on the fully resolved path, so symlinks cannot smuggle in other files.
# See framework/definitions.md.
evidence_dirs: ["evidence"]
