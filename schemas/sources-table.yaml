# Canonical Sources table, shared by both blueprint templates and the linter.
# One row per key claim. Basis names where the claim comes from. Source holds a
# link to an http(s) URL or to a file in the repository, never the page itself.
# See framework/definitions.md.

columns:
  - "#"
  - "Claim"
  - "Basis"
  - "Source"

# Matched case-insensitively after trimming whitespace. Any other value,
# including a blank cell, is a VT007 error.
# "model card" covers what the model card reports and the licence or usage terms
# a model's publisher sets for it. "research" covers papers, benchmarks, and
# upstream issue reports. "project documentation" covers upstream open source
# project docs, standards bodies' published specifications, whitepapers, and
# conformance programs (TM Forum, CAMARA, 3GPP, IETF RFCs), and
# laws and regulations that official bodies publish (EUR-Lex). Blog posts are
# not project documentation.
basis_values:
  - "model card"
  - "research"
  - "Red Hat guidance"
  - "industry use case"
  - "project documentation"
