# Docs site. Build: `make site` (strict). Preview: `make serve`.
# Pages come from site-src/ plus framework/, architecture/, platform/,
# proposal/, and catalog/ (added in place by tools/site/hooks.py, which publishes catalog/ under
# recipes/). Every page needs a nav line. The explorer owns the home page.
site_name: OTel Telco Production Blueprints
site_url: https://ravisharma5.github.io/otel-telco-blueprints/
# No repo_url: Material's repo widget fetches stats from api.github.com. The
# GitHub link sits in extra.social instead (a plain link, no request).
docs_dir: site-src
site_dir: site
strict: true
hooks:
  - tools/site/hooks.py
# The footer carries the contributor page link; absolute because every page
# depth shares this line (the merge link check resolves it).
copyright: >-
  Docs CC BY 4.0, code Apache-2.0 ·
  <a href="/otel-telco-blueprints/templates/">Write a blueprint</a>
theme:
  name: material
  # Light and dark follow the system setting, like brand/tokens.css (no toggle).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  # No Google Fonts: the brand fonts are served from brand/fonts/.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
extra_css:
  - brand/tokens.css
  - brand/material.css
# Runs before Material renders diagrams (on DOMContentLoaded), so window.mermaid
# exists and Material never fetches Mermaid from unpkg.
extra_javascript:
  - brand/vendor/mermaid/mermaid.min.js
extra:
  # The logo goes to the site root (the explorer), relative so previews work.
  homepage: ./
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ravisharma5/otel-telco-blueprints
      name: GitHub
plugins:
  - search
markdown_extensions:
  - tables
  - attr_list
  - admonition
  - toc:
      permalink: true
      # Same anchors as GitHub and bplint (tools/bplint/slug.py).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      base_path: ["templates"]
      check_paths: true
      restrict_base_path: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
    not_found: warn
    # Only the Use cases entry: the explorer at the site root, outside docs_dir.
    absolute_links: info
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
not_in_nav: |
  /platform/*/sources/
  /catalog/*/*/sources/
  /templates.md
nav:
  # Same order as the explorer header; Use cases is the explorer at the site root.
  - Use cases: /otel-telco-blueprints/
  - Recipes:
      # Grouped by domain in schema order, then Ideas; pages sorted by id (tools/tests/test_site.py).
      - Overview: catalog/index.md
      - Standards and knowledge:
          - Grounded knowledge assistant: catalog/standards-knowledge/grounded-knowledge-assistant/README.md
          - OSS and BSS architecture guidance: catalog/standards-knowledge/oss-bss-architecture-guidance/README.md
      - Network software:
          - RAN and core code assistant: catalog/network-software/ran-core-code-assistant/README.md
          - Network automation review: catalog/network-software/network-automation-review/README.md
      - Network operations:
          - Adaptation ladder on alarm triage: catalog/network-operations/alarm-triage-adaptation/README.md
          - Signalling trace analysis: catalog/network-operations/signalling-trace-analysis/README.md
          - Core network root-cause analysis: catalog/network-operations/core-network-rca/README.md
          - RAN and RF health checks: catalog/network-operations/ran-rf-health-checks/README.md
          - RAN energy saving: catalog/network-operations/ran-energy-saving/README.md
          - Slice SLA assurance: catalog/network-operations/slice-sla-assurance/README.md
          - MOP validation: catalog/network-operations/mop-validation/README.md
          - Transport and IP diagnostics: catalog/network-operations/transport-ip-diagnostics/README.md
          - Cross-domain OSS correlation: catalog/network-operations/cross-domain-oss-correlation/README.md
      - Agentic operations:
          - Governed closed-loop incident handling: catalog/agentic-operations/closed-loop-incident-handling/README.md
          - Read-only router and 5G core operations: catalog/agentic-operations/router-core-read-only-ops/README.md
          - CNF upgrade pre- and post-checks: catalog/agentic-operations/cnf-upgrade-checks/README.md
      - Business assurance:
          - Churn risk explanation: catalog/business-assurance/churn-risk-explanation/README.md
          - Revenue assurance triage: catalog/business-assurance/revenue-assurance-triage/README.md
          - CAMARA customer-care diagnostics: catalog/business-assurance/camara-care-diagnostics/README.md
          - Broadband digital troubleshooting: catalog/business-assurance/broadband-digital-troubleshooting/README.md
      - Security:
          - Security alert triage: catalog/security/security-triage/README.md
          - Software onboarding and CVE review: catalog/security/software-onboarding-cve-review/README.md
      - Ideas:
          - Overview: catalog/ideas/index.md
          - Site change-risk gate: catalog/ideas/site-change-risk-gate/README.md
          - Standards and change-request summaries: catalog/ideas/spec-summarisation/README.md
          - Site log reduction: catalog/ideas/site-log-reduction/README.md
          - KPI root-cause reasoning: catalog/ideas/kpi-rca-reasoning/README.md
          - 5G mobility failure analysis: catalog/ideas/mobility-failure-analysis/README.md
          - Signalling attack classification: catalog/ideas/signalling-attack-classification/README.md
          - O-RAN RIC xApp assistant: catalog/ideas/oran-ric-xapp-assistant/README.md
  - Platform:
      - Overview: platform/index.md
      - Serving, routing, and placement: platform/serving-routing-placement/README.md
      - Integration: platform/integration/README.md
      - Safety and autonomy gating: platform/safety-autonomy-gating/README.md
      - Action layer: platform/action-layer/README.md
      - Evaluation and acceptance: platform/evaluation-acceptance/README.md
      - Adaptation: platform/adaptation/README.md
      - Bring your own data and policies: platform/bring-your-own-data/README.md
      - Quality operations and observability: platform/quality-operations/README.md
      - Security, identity, and sandbox: platform/security-identity-sandbox/README.md
      - Intake and model selection: platform/intake-model-selection/README.md
      - Compliance, sovereignty, and operating model: platform/compliance-operating-model/README.md
  - Architecture:
      - Overview: architecture/index.md
      - Decision gate: architecture/decision-gate.md
      - Adaptation ladder: architecture/adaptation-ladder.md
      - Placement: architecture/placement.md
      - Crosswalk: architecture/crosswalk.md
  - Framework:
      - Readiness questions: framework/index.md
      - Definitions: framework/definitions.md
      - Glossary: framework/glossary.md
      - Style guide: framework/style-guide.md
      - Review checklist: framework/review-checklist.md
  - Proposal: proposal/index.md
